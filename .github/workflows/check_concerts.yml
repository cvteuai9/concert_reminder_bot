name: Check Concerts

# Manual-only: the real schedule now runs locally (see run_check.ps1 +
# Windows Task Scheduler) so requests come from a home IP instead of
# GitHub's, which tixCraft/KKTIX/Ticket Plus block. This workflow is kept
# as an ad-hoc debugging tool, not a persistent execution path - it does
# not commit state back, since data/*.json are local-only (gitignored).
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run concert check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m src.main
